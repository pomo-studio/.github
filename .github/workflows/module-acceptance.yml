name: Module acceptance

# Reusable: run the acceptance example in Terraform Cloud, then destroy it.
# Apply and destroy execute in a non-production Terraform Cloud workspace, so
# cloud credentials stay in Terraform Cloud and the workflow only orchestrates
# through the API. Dispatch it deliberately; it never runs automatically, which
# keeps it within the contribution guide's rule that applies and destroys need
# explicit authorization.
#
# The workspace must be VCS-connected to the calling repository, with its working
# directory set to the example (for example `examples/live`), AWS credentials
# configured, and Terraform pinned to the module's declared floor.

on:
  workflow_call:
    inputs:
      organization:
        description: Terraform Cloud organization
        type: string
        default: Pitangaville
      workspace:
        description: Terraform Cloud workspace that runs the acceptance example
        type: string
        required: true
      skip_destroy:
        description: Leave the example in place for debugging; never set this for a release gate
        type: boolean
        default: false
      timeout_minutes:
        description: Job timeout, bounding the cost of a stuck run
        type: number
        default: 60
    secrets:
      TF_API_TOKEN:
        description: Terraform Cloud API token with access to the workspace
        required: true

permissions:
  contents: read

jobs:
  acceptance:
    name: Apply and destroy in Terraform Cloud
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Apply, then destroy, in Terraform Cloud
        env:
          TFC_TOKEN: ${{ secrets.TF_API_TOKEN }}
          TFC_ORGANIZATION: ${{ inputs.organization }}
          TFC_WORKSPACE: ${{ inputs.workspace }}
          SKIP_DESTROY: ${{ inputs.skip_destroy }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          tfc() { curl -sf -H "Authorization: Bearer $TFC_TOKEN" "$@"; }

          # Queue a run in the workspace. With no configuration version, Terraform
          # Cloud uses the workspace's latest configuration, which is the branch head.
          queue_run() {
            local destroy=$1 message=$2
            curl -sf -X POST \
              -H "Authorization: Bearer $TFC_TOKEN" \
              -H "Content-Type: application/vnd.api+json" \
              -d "{\"data\":{\"attributes\":{\"message\":\"$message\",\"is-destroy\":$destroy},\"type\":\"runs\",\"relationships\":{\"workspace\":{\"data\":{\"type\":\"workspaces\",\"id\":\"$WS_ID\"}}}}}" \
              "https://app.terraform.io/api/v2/runs" | jq -r '.data.id'
          }

          # Poll a run until terminal state, approving it when it waits for confirmation.
          wait_for_run() {
            local run_id=$1 label=$2
            for i in $(seq 1 120); do
              local status
              status=$(tfc "https://app.terraform.io/api/v2/runs/$run_id" | jq -r '.data.attributes.status')
              echo "$label [$i/120]: $status"
              case "$status" in
                applied|planned_and_finished)
                  echo "$label: succeeded"
                  return 0 ;;
                errored|canceled|force_canceled|discarded)
                  echo "$label: FAILED ($status)"
                  return 1 ;;
                planned|cost_estimated)
                  echo "$label: approving"
                  curl -sf -X POST \
                    -H "Authorization: Bearer $TFC_TOKEN" \
                    -H "Content-Type: application/vnd.api+json" \
                    -d '{"comment":"auto-approved by module acceptance"}' \
                    "https://app.terraform.io/api/v2/runs/$run_id/actions/apply" > /dev/null ;;
              esac
              sleep 15
            done
            echo "$label: timed out after 30 minutes"
            return 1
          }

          WS_ID=$(tfc "https://app.terraform.io/api/v2/organizations/$TFC_ORGANIZATION/workspaces/$TFC_WORKSPACE" | jq -r '.data.id')
          echo "Workspace $TFC_WORKSPACE: $WS_ID"

          # Prefer a VCS run for this exact commit so the plan matches the
          # dispatch. On a re-dispatch there is none, so queue a fresh run.
          RUN_ID=""
          for i in $(seq 1 12); do
            RUN_ID=$(tfc "https://app.terraform.io/api/v2/workspaces/$WS_ID/runs?page%5Bsize%5D=10" \
              | jq -r --arg sha "$COMMIT_SHA" '.data[] | select(.attributes["source-version"] == $sha) | .id' \
              | head -1)
            [ -n "$RUN_ID" ] && break
            sleep 5
          done

          if [ -n "$RUN_ID" ]; then
            echo "Using the VCS run for $COMMIT_SHA: $RUN_ID"
          else
            echo "No VCS run for $COMMIT_SHA; queuing a new run"
            RUN_ID=$(queue_run false "Acceptance apply for $COMMIT_SHA")
            echo "Queued apply run: $RUN_ID"
          fi

          APPLY_STATUS=0
          wait_for_run "$RUN_ID" "Apply" || APPLY_STATUS=1

          if [ "$SKIP_DESTROY" = "true" ]; then
            echo "::warning::skip_destroy is set; leaving resources in place. See $RUN_LINK"
            exit "$APPLY_STATUS"
          fi

          echo "Triggering destroy"
          DESTROY_ID=$(queue_run true "Acceptance destroy for $COMMIT_SHA")
          echo "Destroy run: $DESTROY_ID"

          DESTROY_STATUS=0
          wait_for_run "$DESTROY_ID" "Destroy" || DESTROY_STATUS=1

          if [ "$APPLY_STATUS" -ne 0 ] || [ "$DESTROY_STATUS" -ne 0 ]; then
            echo "::error::Acceptance failed (apply=$APPLY_STATUS destroy=$DESTROY_STATUS)"
            exit 1
          fi
